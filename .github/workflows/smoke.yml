name: smoke-test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Verify release
        run: python scripts/verify_release.py
      - name: Run no-API-key pipeline
        env:
          SRD_CLUSTER_MODEL_DIR: ${{ runner.temp }}/cluster_model
        run: |
          python main_v2.py examples/mp20_demo_1000.csv \
            --profile paper \
            --system-mode manual \
            --non-interactive \
            --disable-quality-memory \
            --enable-audit-report \
            --output-dir "${RUNNER_TEMP}/core-smoke"
